<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto 2 - Color Flipper</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      transition: background-color 0.3s ease;
      background-color: #FFFFFF;
    }
    .tarjeta {
      background: rgba(255, 255, 255, 0.9);
      padding: 2rem 4rem;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    #codigo-color {
      color: #007bff;
      letter-spacing: 2px;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <div class="tarjeta">
    <h2>Color de Fondo: <span id="codigo-color">#FFFFFF</span></h2>
    <button id="btn-cambiar">Cambiar Color</button>
  </div>

  <script>
    const btnCambiar = document.getElementById('btn-cambiar');
    const textoColor = document.getElementById('codigo-color');

    function generarColorHex() {
      const caracteres = '0123456789ABCDEF';
      let color = '#';
      for (let i = 0; i < 6; i++) {
        const indiceAleatorio = Math.floor(Math.random() * caracteres.length);
        color += caracteres[indiceAleatorio];
      }
      return color;
    }

    btnCambiar.addEventListener('click', () => {
      const colorNuevo = generarColorHex();
      document.body.style.backgroundColor = colorNuevo;
      textoColor.textContent = colorNuevo;
    });
  </script>

</body>
</html>
